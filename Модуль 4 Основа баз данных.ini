Модуль 4 Основа баз данных
База данных - структурированное хранилище информации. Информация может быть представлена разными типами данных.
Есть два основных вида баз данных. 
NOSQL - нерелиационные базы данных: MONGODB
SQL - реалиционные базы данных. Представлены в табличном виде: Oracle, MySQL, POstgreSql, Sqllight, Sqlserver.
Основными реалиционными базами данных являются таблицы, атрибуты и связи.
В таблице есть колонки. Они называются сущностями или моделями данных.
Типы данных POstgreSql. PostgresPro

Для целых используем integil
Или намери уже для других
Для уникальныз полей используем например id - serial. Поле id - является первичным в каждой таблице
nameric и decent 
serial - целое неотрицательное 
Ограничения 
default Value - значение по умолчанию
Первая нормальная форма
Аттомарность значений атрибутов а также единичные значения для атрибутов
Вторая нормальная форма. Требует наличия первичных ключей. 
Отрицательне число. 
 Первинчный ключ. При каждом новом значении не повторится. Уникальный
 Наличие внешних ключей
 Внешний ключ - ссылка на первичный ключ связана с таблицей.  :(